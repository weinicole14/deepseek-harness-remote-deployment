services:
  dsh:
    image: node:24
    restart: unless-stopped
    volumes:
      - dsh-data:/data
      - ./dsh:/opt/dsh-config:ro
    environment:
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - PUBLIC_DOMAIN=${PUBLIC_DOMAIN}
    command: ["sh", "-c", "/opt/dsh-config/startup.sh"]
    networks:
      internal:
        # 兼容 nginx/default.conf 里的内网地址（两种部署路径共用一份配置）
        aliases: ["dsh.zeabur.internal"]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/sw.js:/etc/nginx/sw.js:ro
      - ./nginx/.htpasswd:/etc/nginx/.htpasswd:ro
    networks: [internal]
    depends_on: [dsh]

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    networks: [internal]
    depends_on: [nginx]

networks:
  internal:

volumes:
  dsh-data:
  caddy-data:
