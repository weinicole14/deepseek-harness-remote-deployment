server {
    listen 80;
    auth_basic "dsh private";
    auth_basic_user_file /etc/nginx/.htpasswd;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;

    location = /sw.js {
        alias /etc/nginx/sw.js;
        default_type application/javascript;
        add_header Cache-Control "no-cache";
    }

    location /plugins/ {
        proxy_pass http://dsh.zeabur.internal:3080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Accept-Encoding "";
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable";
        sub_filter_types text/javascript application/javascript;
        sub_filter_once on;
        # 特权平面解锁：让客户端认为自己是 loopback
        sub_filter 'isLoopback: pageLocation === void 0 || isLoopbackHostname(pageLocation.hostname)' 'isLoopback: true';
    }

    location /api/ {
        proxy_pass http://dsh.zeabur.internal:3080;
        proxy_http_version 1.1;
        # 特权平面解锁：服务端按 Host/Origin 判断 loopback
        proxy_set_header Host 127.0.0.1:3080;
        proxy_set_header Origin "http://127.0.0.1:3080";
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://dsh.zeabur.internal:3080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Accept-Encoding "";
        proxy_read_timeout 3600s;
        sub_filter_once on;
        # 注入：移动端CSS + Service Worker 注册
        sub_filter '</head>' '<style>/* dsh 移动端适配 CSS（注入用）
 * 适配版本：dsh 0.1.0-rc.6
 * 注入方式：nginx sub_filter 在 </head> 前插入
 * 警告：类名是 CSS Modules hash，升级 dsh 后可能失效，用 compat-check.sh 体检
 */
@media (max-width:768px){
  /* 全局字号基准 */
  html,body{font-size:15px;}

